name: 功能建议
description: 提一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: 要解决的问题
      description: 你或你的 agent 在什么场景下卡住了
    validations:
      required: true
  - type: textarea
    attributes:
      label: 建议的做法
      description: CLI 用法、页面交互或 API 设计
  - type: textarea
    attributes:
      label: 考虑过的替代方案
