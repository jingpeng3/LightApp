[project]
name = "dt"
version = "0.1.0"
description = "给 Agent 用的动态表格"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jingpeng3" }]
keywords = ["agent", "llm", "sqlite", "fastapi", "cli", "knowledge-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.scripts]
dt = "dt.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dt"]
# 前端构建产物被 .gitignore 排除，hatch 默认会跳过，这里显式打进包里；
# uv build 先打 sdist 再从 sdist 构建 wheel，所以两处都要写
artifacts = ["src/dt/static"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/dt/static"]

[tool.pytest.ini_options]
testpaths = ["tests"]
