[project]
name = "dt"
version = "0.1.0"
description = "给 Agent 用的动态表格"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.scripts]
dt = "dt.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
